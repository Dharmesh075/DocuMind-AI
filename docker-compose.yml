version: '3.8'

services:
  # Next.js Liquid Glass Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: documind-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  # FastAPI REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: documind-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://documind:documind_secret@postgres:5432/documind_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - STORAGE_BACKEND=local
    volumes:
      - ./backend/storage/documents:/app/storage/documents
      - ./ml/models:/app/ml/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Celery Background Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: documind-worker
    command: celery -A app.workers.celery_worker worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql+psycopg2://documind:documind_secret@postgres:5432/documind_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend/storage/documents:/app/storage/documents
      - ./ml/models:/app/ml/models
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: documind-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=documind
      - POSTGRES_PASSWORD=documind_secret
      - POSTGRES_DB=documind_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Message Broker
  redis:
    image: redis:7-alpine
    container_name: documind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # MinIO S3 Object Storage
  minio:
    image: minio/minio:latest
    container_name: documind-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
